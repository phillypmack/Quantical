name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # O build precisa vir ANTES do typecheck: next-env.d.ts importa
      # ./.next/types/routes.d.ts, que é gerado pelo build e é gitignored.
      # Em checkout limpo, `tsc --noEmit` sozinho não teria o que resolver.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes end-to-end
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # O roteamento de produção nunca foi testado: os testes locais usam
  # scripts/serve-static.mjs, não o nginx. Este job roda a config real.
  nginx-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Servir out/ com a config de produção
        run: |
          docker run -d --name quantical-nginx -p 8080:80 \
            -v "$PWD/out:/var/www/quantical:ro" \
            -v "$PWD/deploy/nginx.quantical.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

      - name: Toda rota exportada precisa responder 200
        run: node scripts/check-routes.mjs http://localhost:8080

      - name: Logs do nginx em caso de falha
        if: failure()
        run: docker logs quantical-nginx
