# Cabeçalhos de segurança da Quantical.
# Instalar em /etc/nginx/snippets/quantical-headers.conf.
#
# Precisa ser incluído em CADA location: o nginx descarta os `add_header` do
# bloco pai assim que um bloco filho declara qualquer add_header próprio.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# CSP sem 'unsafe-eval'.
#
# Isso só se tornou possível quando o avaliador de ângulos do parser deixou de
# usar o construtor Function() e passou a ser um parser próprio. 'unsafe-inline'
# em script-src ainda é necessário porque a exportação estática do Next embute
# os dados de hidratação em <script> inline, e nonce exigiria servidor.
#
# connect-src precisa listar o projeto Supabase quando a sincronização estiver
# ligada — troque <PROJETO> ou remova a origem se rodar só em modo local.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
