# Quantical — configuração de produção.
#
# Instalar em /etc/nginx/sites-available/quantical e criar o symlink em
# sites-enabled. Os certificados vêm do certbot (ver deploy/README.md).

# Cabeçalhos reutilizados: `add_header` NÃO é herdado quando um bloco filho
# declara o seu próprio, então repetir via include é a única forma segura.
# (A versão anterior declarava três headers no server e os perdia inteiros
# dentro de `location /_next/static/`.)

server {
    listen 80;
    listen [::]:80;
    server_name quantical.com.br www.quantical.com.br;

    # ACME continua acessível em texto claro para a renovação do certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://quantical.com.br$request_uri;
    }
}

# www -> apex, para não dividir autoridade de domínio entre dois hosts.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.quantical.com.br;

    ssl_certificate     /etc/letsencrypt/live/quantical.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantical.com.br/privkey.pem;

    return 301 https://quantical.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quantical.com.br;

    root /var/www/quantical;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/quantical.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quantical.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml;

    # Se o módulo brotli estiver disponível, descomente:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        include /etc/nginx/snippets/quantical-headers.conf;
        # A exportação estática grava cada rota como <rota>.html e TAMBÉM cria
        # um diretório <rota>/ contendo apenas payloads RSC (.txt), sem
        # index.html. Sondar diretório antes do .html faz o try_files parar no
        # diretório vazio e devolver 403 — era o que derrubava 61 das 62 rotas.
        # O .html precisa vir primeiro.
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = / {
        include /etc/nginx/snippets/quantical-headers.conf;
        try_files /index.html =404;
    }

    # Assets com hash no nome: imutáveis por definição.
    location /_next/static/ {
        include /etc/nginx/snippets/quantical-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location = /sw.js {
        include /etc/nginx/snippets/quantical-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # HTML nunca em cache longo: é o que carrega as referências novas.
    location ~* \.html$ {
        include /etc/nginx/snippets/quantical-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/quantical-headers.conf;
        internal;
    }
}
